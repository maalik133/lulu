<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lululemon $500</title>
<style>
:root { --ink:#111; --page:#fff; --muted:#666; --brand:#EB000B; --line:#e7e7e7; --panel:#fff; }
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--page); }
body { padding:44px 18px 64px; }
.shell { width:min(100%,900px); margin:0 auto; }
.hero { text-align:center; }
h1 { margin:0; font-size:clamp(30px,6vw,62px); line-height:1.05; letter-spacing:-2px; font-weight:850; white-space:nowrap; }
.subtitle { margin:20px auto 0; color:var(--muted); font-size:clamp(19px,4.2vw,30px); line-height:1.35; }
.card-wrap { width:100%; max-width:none; margin:24px auto 0; padding:0; }
.card-wrap img { display:block; width:100%; max-width:none; height:auto; margin:0 auto; }
.cta { display:flex; align-items:center; justify-content:center; gap:18px; width:100%; margin-top:32px; padding:27px 24px; border:0; border-radius:30px; background:var(--brand); color:white; text-decoration:none; font-size:clamp(24px,4.8vw,34px); font-weight:800; cursor:pointer; transition:transform .15s ease,opacity .15s ease; }
.cta:hover { opacity:.94; } .cta:active { transform:scale(.99); }
.how { margin-top:56px; }
.how-title { display:flex; align-items:center; gap:18px; margin:0 0 30px; font-size:clamp(32px,5.5vw,46px); font-weight:850; letter-spacing:-1.2px; }
.check { width:56px; height:56px; border:3px solid var(--ink); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:31px; }
.steps { display:grid; gap:22px; }
.step { display:grid; grid-template-columns:82px 1fr 58px; align-items:center; gap:22px; min-height:150px; padding:26px 28px; border:1px solid var(--line); border-radius:30px; background:var(--panel); box-shadow:0 1px 2px rgba(0,0,0,.025); }
.icon { width:72px; height:72px; display:grid; place-items:center; border-radius:22px; background:#fff2f3; font-size:34px; }
.step h3 { margin:0; font-size:clamp(22px,4vw,31px); line-height:1.18; }
.step p { margin:8px 0 0; color:var(--muted); font-size:clamp(17px,3.5vw,24px); line-height:1.4; }
.num { width:58px; height:58px; display:grid; place-items:center; border-radius:50%; background:var(--brand); color:white; font-size:25px; font-weight:800; }
@media (max-width:980px) { body{padding:34px 16px 52px}.card-wrap{width:100%;max-width:none;margin:24px auto 0;padding:0}.cta{border-radius:24px;padding:24px 20px}.step{grid-template-columns:64px 1fr 48px;gap:15px;padding:22px 18px;border-radius:24px}.icon{width:58px;height:58px;border-radius:18px;font-size:28px}.num{width:48px;height:48px;font-size:21px} }
</style>
</head>
<body>
<main class="shell">
<section class="hero">
  <h1>Lululemon $500 Reward</h1>
  <div class="card-wrap">
    <img src="lululemon-500-hero.png" alt="Lululemon $500 card">
  </div>
  <a class="cta" id="offer-link" href="https://giftclick.org/aff_c?offer_id=4440&amp;aff_id=170653&amp;source=tiktok">
    <span>Get Started</span><span aria-hidden="true">→</span>
  </a>
</section>
<section class="how">
  <h2 class="how-title"><span class="check">✓</span><span>How It Works</span></h2>
  <div class="steps">
    <article class="step"><div class="icon">✉</div><div><h3>Enter your email address</h3><p>For instant reward notifications</p></div><div class="num">1</div></article>
    <article class="step"><div class="icon">▣</div><div><h3>Complete 2–3 simple deals</h3><p>Quick 10–20 min each — the more you do, the more you earn</p></div><div class="num">2</div></article>
    <article class="step"><div class="icon">▤</div><div><h3>Get paid instantly</h3><p>Receive your reward after completing the required steps</p></div><div class="num">3</div></article>
  </div>
</section>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const campid = new URLSearchParams(window.location.search).get("campid");
  if (!campid) return;
  const offerLink = document.getElementById("offer-link");
  if (!offerLink) return;
  const offerUrl = new URL(offerLink.href);
  offerUrl.searchParams.set("source", campid);
  offerLink.href = offerUrl.toString();
});
</script>
</body>
</html>
